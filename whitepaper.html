<!DOCTYPE html>
<html lang="en-US" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <script>(function(){try{var t=localStorage.getItem('zeitona-theme');document.documentElement.dataset.theme=t==='dark'?'dark':'light';}catch(e){document.documentElement.dataset.theme='light';}}());</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="page.whitepaperTitle">Whitepaper | Zeitona</title>
    <meta name="description" data-i18n-content="page.whitepaperDescription"
        content="The Zeitona technical whitepaper is currently in the final stages of refinement." />

    <!-- Open Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load styles -->
    <link rel="stylesheet" href="style.css" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/azeitona3.png" />

    <style>
        .whitepaper-body {
            background-color: var(--background) !important;
        }
        .minimal-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            padding: 4rem 1.5rem;
            text-align: center;
            background: var(--background) !important;
        }
        .minimal-title {
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            color: var(--foreground);
            margin-bottom: 1.5rem;
            letter-spacing: -0.01em;
        }
        .minimal-description {
            max-width: 650px;
            font-size: 1.15rem;
            line-height: 1.8;
            color: var(--muted);
            margin: 0 auto 3rem;
        }
        .status-tag {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border: 1px solid var(--brand-olive);
            color: var(--brand-olive);
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 2rem;
        }
        .nav-minimal {
            border-bottom: 1px solid rgba(0,0,0,0.05);
            background: var(--background);
        }
    </style>
</head>
<body class="whitepaper-body">
    <!-- Nav Placeholder -->
    <div id="header-placeholder"></div>

    <main>
        <!-- Ultra Minimalist Content -->
        <section class="minimal-section">
            <h1 class="minimal-title fade-up visible delay-100" data-i18n-html="whitepaper.heading">
                The Zeitona <strong>Whitepaper</strong>
            </h1>

            <p class="minimal-description fade-up visible delay-200" data-i18n-html="whitepaper.description">
                Our technical whitepaper is currently in the final stages of refinement.<br />
                Stay tuned; we will be sharing more updates soon.
            </p>

            <div class="fade-up visible delay-300" style="margin-top: 1rem;">
                <a href="index.html" class="text-muted hover:text-accent font-semibold transition-colors"
                    style="font-size: 0.875rem;" data-i18n="nav.backToHomepage">
                    ← Back to Homepage
                </a>
            </div>
        </section>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Load Script -->
    <script src="i18n.js"></script>
    <script src="script.js?v=5"></script>
</body>
</html>
