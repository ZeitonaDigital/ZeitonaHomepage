<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice">
  <!-- Background -->
  <rect width="900" height="600" fill="#ECEEF0" />
  
  <!-- Subtle horizontal guide lines -->
  <line x1="0" y1="150" x2="900" y2="150" stroke="#16181D" stroke-opacity="0.05" stroke-width="1" />
  <line x1="0" y1="300" x2="900" y2="300" stroke="#16181D" stroke-opacity="0.08" stroke-width="1" />
  <line x1="0" y1="450" x2="900" y2="450" stroke="#16181D" stroke-opacity="0.05" stroke-width="1" />
  
  <!-- Central large green circle -->
  <g transform="translate(450, 300)">
    <circle r="220" fill="#003D2E" fill-opacity="0.92" />
    <circle r="240" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8" />
    <circle r="260" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.5" />
    <circle r="200" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4" />
  </g>
  
  <!-- Offset charcoal rectangle top-left -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="160" height="160" fill="#16181D" fill-opacity="0.9" />
    <rect x="20" y="20" width="120" height="120" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7" />
  </g>
  
  <!-- Bottom-right green-stroke square -->
  <g transform="translate(700, 420)">
    <rect x="0" y="0" width="100" height="100" fill="none" stroke="#003D2E" stroke-width="2" stroke-opacity="0.8" />
    <circle cx="50" cy="50" r="16" fill="#003D2E" />
  </g>
  
  <!-- Top-right white rectangle -->
  <rect x="650" y="50" width="200" height="120" fill="#FFFFFF" fill-opacity="0.75" />
  
  <!-- Small accent squares -->
  <rect x="300" y="450" width="16" height="16" fill="#7FA800" />
  <rect x="330" y="450" width="16" height="16" fill="#16181D" fill-opacity="0.6" />
</svg>