<!DOCTYPE html>
<html lang="en-US" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <script>(function () { try { var t = localStorage.getItem('zeitona-theme'); document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; } }());</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="contact.metaTitle">Contact - Zeitona</title>
    <meta name="description" data-i18n-content="contact.heroTitle"
        content="Begin with the work you want to understand." />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
</head>

<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="about-perspective section" id="email">
            <div class="container">
                <div class="contact-email-card fade-up">
                    <p class="about-eyebrow" data-i18n="contact.emailEyebrow">Contact email</p>
                    <h2 class="section-title" data-i18n="contact.emailTitle">Write directly to us</h2>
                    <p>
                        <a class="card-link contact-email-link" href="mailto:contact@zeitona.pt">contact@zeitona.pt</a>
                    </p>
                </div>
            </div>
        </section>

        <section class="about-approach section" id="form">
            <div class="container">
                <div class="section-header fade-up">
                    <p class="about-eyebrow" data-i18n="contact.formEyebrow">Or send a message</p>
                    <h2 class="section-title" data-i18n="contact.formTitle">Send a message</h2>
                </div>
                <form class="contact-form modal-form fade-up" id="contact-form" novalidate>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="contact-name" data-i18n="contact.formName">Your name</label>
                            <input class="form-input" id="contact-name" name="name" type="text" required />
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="contact-email" data-i18n="contact.formEmail">Your
                                email</label>
                            <input class="form-input" id="contact-email" name="email" type="email" required />
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="contact-subject" data-i18n="contact.formSubject">Subject</label>
                        <input class="form-input" id="contact-subject" name="subject" type="text" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="contact-message" data-i18n="contact.formMessage">Message</label>
                        <textarea class="form-input form-textarea" id="contact-message" name="message" rows="6"
                            required></textarea>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary btn-lg" data-i18n="contact.formSubmit">Send
                            message</button>
                        <p id="contact-form-status" class="form-status" aria-live="polite"></p>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="i18n.js"></script>
    <script src="script.js?v=8"></script>
    <script>
        window.scrollTo(0, 0);
    </script>
    <script>
        (function () {
            var form = document.getElementById('contact-form');
            var status = document.getElementById('contact-form-status');
            if (!form) return;

            function getText(key, fallback) {
                if (window.i18n && typeof window.i18n.t === 'function') {
                    return window.i18n.t(key);
                }
                return fallback;
            }

            function setStatus(message, isError) {
                if (!status) return;
                status.textContent = message;
                status.style.color = isError ? '#b42318' : '#013D2F';
                status.style.display = 'block';
            }

            form.addEventListener('submit', function (event) {
                event.preventDefault();
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                var name = document.getElementById('contact-name').value.trim();
                var email = document.getElementById('contact-email').value.trim();
                var subject = document.getElementById('contact-subject').value.trim();
                var message = document.getElementById('contact-message').value.trim();
                var submitButton = form.querySelector('button[type="submit"]');
                var sendingText = getText('contact.formSending', 'Sending your message...');
                var submitText = getText('contact.formSubmit', 'Send message');
                var busyText = getText('contact.formSubmitBusy', 'Sending...');
                var successText = getText('contact.formSuccess', 'Your message has been sent successfully.');
                var errorText = getText('contact.formError', 'We could not send your message right now. Please try again later.');

                if (submitButton) {
                    submitButton.disabled = true;
                    submitButton.textContent = busyText;
                }

                setStatus(sendingText, false);

                fetch('https://formsubmit.co/ajax/contact@zeitona.pt', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        subject: subject,
                        message: message,
                        _captcha: 'false'
                    })
                })
                    .then(function (response) {
                        if (!response.ok) {
                            throw new Error('Request failed');
                        }
                        return response.json();
                    })
                    .then(function () {
                        form.reset();
                        setStatus(successText, false);
                    })
                    .catch(function () {
                        setStatus(errorText, true);
                    })
                    .finally(function () {
                        if (submitButton) {
                            submitButton.disabled = false;
                            submitButton.textContent = submitText;
                        }
                    });
            });
        })();
    </script>
</body>

</html>
