<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hero-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#003D2E"/>
      <stop offset="1" stop-color="#002A20"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#hero-base)"/>

  <!-- large concentric rings -->
  <circle cx="1250" cy="380" r="320" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="1250" cy="380" r="230" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="1250" cy="380" r="95" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- diagonal line -->
  <line x1="880" y1="900" x2="1600" y2="200" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>

  <!-- offset square block -->
  <rect x="135" y="120" width="130" height="130" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
  <rect x="195" y="180" width="70" height="70" fill="#FFFFFF" fill-opacity="0.14"/>

  <!-- horizontal band -->
  <rect x="0" y="700" width="1600" height="8" fill="#FFFFFF" fill-opacity="0.14"/>

  <!-- small square rhythm -->
  <rect x="1120" y="660" width="18" height="18" fill="#FFFFFF" fill-opacity="0.5"/>
  <rect x="1152" y="660" width="18" height="18" fill="#FFFFFF" fill-opacity="0.2"/>
  <rect x="1184" y="660" width="18" height="18" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- top-right corner arc -->
  <path d="M 1450 0 A 420 420 0 0 1 1600 150" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"/>
</svg>