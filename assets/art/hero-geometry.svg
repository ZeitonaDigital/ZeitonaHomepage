<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hero-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#003D2E"/>
      <stop offset="1" stop-color="#002A20"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="550" fill="url(#hero-base)"/>

  <!-- subtle horizontal lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.05">
    <line x1="0" y1="137" x2="1600" y2="137"/>
    <line x1="0" y1="275" x2="1600" y2="275"/>
    <line x1="0" y1="412" x2="1600" y2="412"/>
  </g>

  <!-- offset square, top-left -->
  <rect x="150" y="80" width="110" height="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="175" y="105" width="60" height="60" fill="#FFFFFF" fill-opacity="0.1"/>
  <rect x="262" y="192" width="24" height="24" fill="#EB0008"/>

  <!-- bold red vertical slab -->
  <rect x="620" y="0" width="14" height="550" fill="#EB0008" fill-opacity="0.85"/>

  <!-- concentric rings, offset right -->
  <circle cx="1200" cy="270" r="220" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
  <circle cx="1200" cy="270" r="165" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="1200" cy="270" r="105" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="1200" cy="270" r="36" fill="#EB0008"/>

  <!-- red tick on the outer ring -->
  <line x1="1081" y1="371" x2="1102" y2="350" stroke="#EB0008" stroke-width="5"/>

  <!-- small square accent near rings -->
  <rect x="1030" y="430" width="14" height="14" fill="#FFFFFF" fill-opacity="0.5"/>
  <rect x="1054" y="430" width="14" height="14" fill="#FFFFFF" fill-opacity="0.2"/>
  <rect x="1078" y="430" width="14" height="14" fill="#EB0008"/>

  <!-- top-right corner arcs -->
  <path d="M 1460 0 A 420 420 0 0 1 1600 140" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>
  <path d="M 1520 0 A 300 300 0 0 1 1600 80" fill="none" stroke="#EB0008" stroke-opacity="0.85" stroke-width="2.5"/>

  <!-- horizontal bands -->
  <rect x="0" y="510" width="1600" height="6" fill="#FFFFFF" fill-opacity="0.14"/>
  <rect x="0" y="516" width="1600" height="2" fill="#EB0008" fill-opacity="0.75"/>
</svg>